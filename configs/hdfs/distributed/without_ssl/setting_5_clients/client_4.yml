cid: 4
fabric:
  accelerator: cpu
root_dir: ${oc.env:PWD}
model:
  name: deeplog
  config:
    input_shape: 1
    mid_shape: 64
    n_classes: 33
    lr: 0.01
    n_layers: 2
    num_candidates: 9
    window_size: 10
data:
  name: hdfs
  config:
    train_file: ${root_dir}/datasets/hdfs_datasets/setting_5_clients/train3.csv
    val_file: ${root_dir}/datasets/hdfs_datasets/setting_5_clients/val3.csv
    batch_size: 512
    window_size: 10
server_adress: ${oc.env:SERVER_ADDRESS, "localhost:22222" }
